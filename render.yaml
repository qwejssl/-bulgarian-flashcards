services:
  - type: web
    name: bulgarian-flashcards-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false        # you enter this manually in Render dashboard
      - key: WEBHOOK_URL
        fromService:
          type: web
          name: bulgarian-flashcards-bot
          property: host
          transform: "https://{value}"
      - key: PORT
        value: "10000"
    plan: free
